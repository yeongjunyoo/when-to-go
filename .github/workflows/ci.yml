name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test (mocked upstream, zero real API calls)
        run: npx vitest run

      - name: Forbidden-term check
        run: npm run check:terms

      - name: Build (worker typecheck + web production bundle)
        run: npm run build

      - name: Production fixture guard
        run: npm run check:fixtures

      - name: B-index approval double guard
        run: npm run check:index-approval

      - name: Design token guard (색 하드코딩·기본 팔레트·미정의 토큰)
        run: npm run check:design-tokens
